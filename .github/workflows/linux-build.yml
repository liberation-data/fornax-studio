name: Linux build

# Builds the Linux Studio app with electron-builder: a .deb and an .rpm, x64, carrying Fornax's backend, the engines'
# Vulkan libraries and a Java runtime of its own (fornax-backend.yml builds those). Nothing is signed: Linux has no
# Gatekeeper or SmartScreen to satisfy, so this needs no signing secrets and no environment; only KILN_DEPLOY_KEY, to
# read the Fornax repository, in the backend job.
#
# - By hand (workflow_dispatch), and on a pull request that changes the packaging: builds, checks, and keeps the
#   packages as the run's artifacts.
# - On a published GitHub Release: the same, from the release's tag, with the packages attached to the release, beside
#   macos-signed.yml's.
#
# x64 only for now. arm64 would be a second leg on an arm64 runner (ubuntu-24.04-arm), the engines built there too.
# Vulkan only: the packages run on any GPU with a Vulkan driver (Mesa's RADV and ANV, NVIDIA's own), not HIP or CUDA.

on:
  workflow_dispatch:
  release:
    types: [published]
  pull_request:
    paths:
      - .github/workflows/linux-build.yml
      - .github/workflows/fornax-backend.yml
      - fornax.ref
      - package.json
      - package-lock.json
      - next.config.ts
      - main.cjs
      - preload.cjs
      - server-start.cjs
      - fornax-command.cjs
      - build/**
      - scripts/**

# Read-only by default. Only the attach job below, which runs no build code, may write to the repo, and only to upload
# the release assets.
permissions:
  contents: read

jobs:
  backend:
    name: Fornax backend (x64)
    # A newer run replaces an older one on the same ref, but a release run is never cancelled.
    concurrency:
      group: linux-backend-${{ github.event.release.tag_name || github.ref }}
      cancel-in-progress: ${{ github.event_name != 'release' }}
    uses: ./.github/workflows/fornax-backend.yml
    with:
      runner: ubuntu-24.04
      backend: vulkan
      artifact: fornax-studio-server-linux-x64
    secrets:
      KILN_DEPLOY_KEY: ${{ secrets.KILN_DEPLOY_KEY }}

  build:
    name: Build and check (x64)
    needs: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # A newer run replaces an older one on the same ref, but a release run is never cancelled, so a release isn't left
    # without its Linux packages.
    concurrency:
      group: linux-build-${{ github.event.release.tag_name || github.ref }}
      cancel-in-progress: ${{ github.event_name != 'release' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # electron-builder shells out to rpmbuild to make the .rpm; it isn't on the stock Ubuntu runner, so the .rpm
      # target fails without it.
      - name: Install rpm tooling
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm > /dev/null

      - name: Download the backend
        uses: actions/download-artifact@v4
        with:
          name: fornax-studio-server-linux-x64
          path: ${{ runner.temp }}/backend

      - name: Unpack the backend into server/
        run: mkdir -p server && tar -C server -xf "$RUNNER_TEMP/backend/server.tar" && ls -lR server | head -40

      - name: Build the app
        run: npm run build

      - name: Package
        run: npx electron-builder --linux --x64 --publish never

      # The package must carry the backend, its libraries and its own Java, with java still executable.
      - name: Check the package carries the backend
        run: |
          set -euo pipefail
          server=dist/linux-unpacked/resources/server
          test -f "$server/fornax-studio-server.jar"
          for lib in libfornax_llama libstable-diffusion libfornax_acestep; do test -f "$server/native/$lib.so"; done
          test -x "$server/jre/bin/java"
          "$server/jre/bin/java" -version

      # The packages pull in a Vulkan driver (Mesa's, unless NVIDIA's is there) and the loader. Check that the driver
      # dependency made it into both packages, and that a stock Ubuntu and a stock Fedora can resolve every dependency,
      # without installing anything. Weak dependencies are off: the loader itself only recommends Mesa's driver, which
      # would otherwise hide a missing hard dependency.
      - name: Check the packages' dependencies resolve
        run: |
          set -euo pipefail
          dpkg-deb -f dist/*.deb Depends | grep -F 'mesa-vulkan-drivers | vulkan-icd'
          sudo apt-get install --dry-run --no-install-recommends ./dist/*.deb > "$RUNNER_TEMP/apt.log" \
            || { cat "$RUNNER_TEMP/apt.log"; exit 1; }
          grep -E '^Inst (mesa-vulkan-drivers|libvulkan1)' "$RUNNER_TEMP/apt.log" || echo "(the runner already has them)"
          rpm=$(ls dist/*.rpm)
          rpm -qp --requires "$rpm" | grep -Fx '(mesa-vulkan-drivers or xorg-x11-drv-nvidia-libs or nvidia-driver-libs)'
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:latest \
            dnf install -y --setopt=tsflags=test --setopt=install_weak_deps=False "/dist/$(basename "$rpm")" \
            > "$RUNNER_TEMP/dnf.log" 2>&1 || { cat "$RUNNER_TEMP/dnf.log"; exit 1; }
          grep -E '^ *mesa-vulkan-drivers ' "$RUNNER_TEMP/dnf.log" || { cat "$RUNNER_TEMP/dnf.log"; exit 1; }

      # The .deb writes /usr/bin/fornax, the fornax command on the app's own Java, and removing it takes that away. Installed
      # for real here, then removed. Skipped when this Fornax has no fornax-cli.
      - name: Check the .deb installs and removes the fornax command
        run: |
          set -euo pipefail
          if [ ! -d dist/linux-unpacked/resources/server/fornax-cli ]; then echo "No fornax command in this build"; exit 0; fi
          sudo apt-get install -y -qq --no-install-recommends ./dist/*.deb > /dev/null
          head -n 2 /usr/bin/fornax
          head -n 5 /usr/bin/fornax | grep -q '^# fornax-studio-launcher'
          env -u JAVA_HOME PATH=/usr/bin:/bin fornax --version
          env -u JAVA_HOME PATH=/usr/bin:/bin HF_HUB_CACHE="$RUNNER_TEMP/hf" fornax list
          sudo apt-get remove -y -qq fornax-studio > /dev/null
          if [ -e /usr/bin/fornax ]; then echo "::error::/usr/bin/fornax is still there after removing the package"; exit 1; fi

      # Start the packaged app under a virtual display, with every kind of work stubbed (no GPU on the runner, no
      # models), and wait for the studio's server and Fornax's backend to answer: the backend started by the app, on the
      # app's own Java, with no Java on the PATH or in JAVA_HOME. We run the unpacked build, the same binary that goes
      # into the .deb and .rpm, with --no-sandbox, because Chromium's SUID sandbox helper isn't set up in the unpacked
      # tree (the installed package sets it up); that's an install-time concern, not what this gate checks.
      - name: Smoke-test the app
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq xvfb libvulkan1 > /dev/null
          app="dist/linux-unpacked/fornax-studio"
          env -u JAVA_HOME PATH=/usr/bin:/bin FORNAX_ALLOW_CPU=true FORNAX_STUDIO_STUB=chat,image,song FORNAX_STUDIO_HOME="$RUNNER_TEMP/fornax-studio" \
            xvfb-run -a "$app" --no-sandbox > "$RUNNER_TEMP/app.log" 2>&1 &
          pid=$!
          ok=0
          for _ in $(seq 1 90); do
            if curl -fsS -o /dev/null http://localhost:5190/ && curl -fsS http://127.0.0.1:5191/api/health; then ok=1; break; fi
            kill -0 "$pid" 2>/dev/null || break
            sleep 2
          done
          kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true
          pkill -f fornax-studio || true
          if [ "$ok" != 1 ]; then
            echo "::error::the app did not answer on localhost:5190 and 127.0.0.1:5191"
            cat "$RUNNER_TEMP/app.log"
            cat /tmp/fornax-studio-electron.log 2>/dev/null || true
            exit 1
          fi
          {
            echo "### Fornax Studio, Linux x64"
            echo
            echo "- the app starts, and starts Fornax's backend on its own Java (stubbed, --no-sandbox, under xvfb)"
            echo
            ls -l dist/*.deb dist/*.rpm | awk '{print "- " $NF ": " $5 " bytes"}'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: fornax-studio-linux-x64
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error
          # A few hundred megabytes a run; a release keeps its own copy as release assets.
          retention-days: 7

  # Attach the packages to the release. A job of its own, so the token that may write to the repo never shares a job
  # with npm or the build. Runs on a published release only.
  attach:
    name: Attach to the release
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fornax-studio-linux-x64
          path: assets
      # --clobber, so re-running a failed release run replaces the assets.
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ls -l assets
          gh release upload "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --clobber
